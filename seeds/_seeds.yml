seeds:
  - name: cities
    description: Cidades monitoradas, com UF e região.
    config:
      column_types:
        city: varchar
        state: varchar
        region: varchar
    columns:
      - name: city
        data_tests: [unique, not_null]

  - name: weather_codes
    description: Códigos WMO de condição do tempo usados pela Open-Meteo.
    config:
      column_types:
        weather_code: integer
        description: varchar
    columns:
      - name: weather_code
        data_tests: [unique, not_null]
