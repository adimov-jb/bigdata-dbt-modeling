sources:
  - name: open_meteo
    description: Camada bronze gravada pelo repositório bigdata-ingestion-python.
    database: "{{ 'hive' if target.type == 'trino' else 'awsdatacatalog' }}"
    schema: "{{ env_var('DBT_SCHEMA_PREFIX', '') }}bronze"
    config:
      loaded_at_field: ingested_at
      freshness:
        warn_after: { count: 2, period: day }
        error_after: { count: 7, period: day }
    tables:
      - name: weather_hourly
        identifier: "{{ var('bronze_weather_table') }}"
        description: Uma linha por cidade e hora, particionada por dt (dia UTC).
        columns:
          - name: city
            data_tests: [not_null]
          - name: observed_at
            data_tests: [not_null]
          - name: dt
            data_tests: [not_null]

      - name: locations
        identifier: "{{ var('bronze_locations_table') }}"
        description: >
          Snapshot diário das cidades monitoradas pela ingestão (fonte open_meteo_locations),
          particionado por dt. É a única lista de cidades do projeto.
        columns:
          - name: city
            data_tests: [not_null]
          - name: dt
            data_tests: [not_null]
