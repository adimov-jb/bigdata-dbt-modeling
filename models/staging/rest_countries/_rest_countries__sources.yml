sources:
  - name: rest_countries
    description: >
      Bronze da Rest Countries v5 gravada pelo repositório bigdata-ingestion-python
      (fonte rest_countries). Cada partição dt é um snapshot completo dos países.
    database: "{{ 'hive' if target.type == 'trino' else 'awsdatacatalog' }}"
    schema: "{{ env_var('DBT_SCHEMA_PREFIX', '') }}bronze"
    config:
      loaded_at_field: ingested_at
      freshness:
        warn_after: { count: 1, period: day }
        error_after: { count: 2, period: day }
    tables:
      - name: countries
        identifier: "{{ var('bronze_rest_countries_table') }}"
        description: Uma linha por país ou território, com códigos ISO, população, área, moedas, idiomas e fusos.
        columns:
          - name: alpha_3
            description: Nulo só nos territórios sem código ISO (iso_status = 'unassigned').
            data_tests:
              - not_null:
                  config:
                    where: "iso_status <> 'unassigned'"
          - name: iso_status
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["official", "user_assigned", "unassigned"]
          - name: name_common
            data_tests: [not_null]
          - name: dt
            data_tests: [not_null]
