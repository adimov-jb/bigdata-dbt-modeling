# Atualizações mensais, agrupadas num PR por ecossistema. A CI valida cada PR.
# Dependências Python ficam em requirements*.lock e são atualizadas com scripts/lock.sh
# (veja o RUNBOOK.md do repositório bigdata-terraform).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # Os .lock são gerados para o Python 3.12, e as outras imagens do projeto também usam 3.12.
      # Trocar de versão é uma decisão do projeto inteiro: mude o FROM e rode scripts/lock.sh.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
